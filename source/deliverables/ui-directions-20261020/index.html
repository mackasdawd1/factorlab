<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FactorLab · 四个设计方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eceef1;color:#22262e;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}h1,h2,p{margin:0}button,a{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #4e648c;outline-offset:4px}header{background:#fcfcfd;border-bottom:1px solid #d7dce3;padding:27px 40px 25px;display:flex;gap:25px;justify-content:space-between;align-items:center}.overline{font-size:10px;letter-spacing:2px;color:#697281}.title{font-size:25px;font-weight:500;letter-spacing:-.6px;margin:6px 0}.intro{color:#606b7b;font-size:13px}.status{border:1px solid #d8dee6;border-radius:4px;padding:6px 11px;font-size:12px;white-space:nowrap;color:#647183}.content{padding:22px 32px 35px;max-width:1800px;margin:auto}.controls{display:flex;gap:15px;align-items:center;margin-bottom:19px;flex-wrap:wrap}.scheme-tabs{display:flex;gap:7px;flex-wrap:wrap}.scheme-tabs button,.view-tabs button{border:1px solid #d0d7df;background:#f7f8fa;color:#5c6878;border-radius:5px;padding:9px 15px;font-size:12px}.scheme-tabs button[aria-pressed=true],.view-tabs button[aria-pressed=true]{background:#252d3a;color:white;border-color:#252d3a}.view-tabs{display:flex;gap:6px;margin-left:auto}.detail{display:flex;justify-content:space-between;gap:30px;align-items:center;background:#fbfbfc;padding:18px 23px;border:1px solid #d9dfe7;border-bottom:0;border-radius:6px 6px 0 0}.detail h2{font-size:18px;font-weight:500}.detail p{font-size:12px;color:#6c7787;margin-top:4px}.chips{display:flex;gap:10px}.chip{display:flex;flex-direction:column;gap:4px;font-size:9px;color:#687486}.chip i{height:19px;width:50px;display:block;border-radius:2px;border:1px solid #00000012;background:var(--c)}.frame-area{background:#dfe3e9;border:1px solid #d0d8e2;overflow:hidden;padding:0}.frame-fit{position:relative;margin:auto}.frame-fit iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:white}.frame-area.mobile{padding:22px 0;background:#dfe3e9}.frame-area.mobile .frame-fit{border-radius:18px;overflow:hidden;box-shadow:0 8px 35px #28344322}.below{display:flex;justify-content:space-between;gap:20px;padding:13px 2px 20px;font-size:12px;color:#647082}.below a{border-bottom:1px solid #aeb9c8}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:22px}.comparison[hidden],.preview[hidden]{display:none}.choice{padding:0;background:#fbfbfc;border:1px solid #d2d9e2;border-radius:7px;overflow:hidden;text-align:left;color:inherit}.choice .choice-head{padding:19px 20px 13px;display:flex;justify-content:space-between;gap:15px}.choice h2{font-size:20px;font-weight:500}.choice p{font-size:12px;color:#677486;margin-top:4px}.mini-swatches{display:flex;gap:4px;padding-top:4px}.mini-swatches i{display:block;width:17px;height:17px;background:var(--c);border-radius:50%;border:1px solid #00000010}.choice img{display:block;width:100%;height:auto;border-top:1px solid #e0e5ec}.choice footer{display:flex;justify-content:space-between;padding:12px 20px;color:#687487;font-size:11px}.sources{font-size:11px;color:#788291;display:flex;flex-wrap:wrap;gap:12px;padding-top:20px}.sources a{text-decoration:underline;text-underline-offset:3px}.sources span{margin-right:auto}.board-only header{padding:24px 32px}.board-only .content{padding-top:20px}.board-only .controls,.board-only .sources{display:none}.board-only .comparison{gap:20px}
@media(max-width:760px){header{padding:24px 20px;display:block}.status{display:inline-block;margin-top:12px}.content{padding:18px 12px}.view-tabs{margin-left:0}.scheme-tabs button{padding:9px 10px}.detail{display:block;padding:17px}.chips{margin-top:13px}.chip i{width:44px}.detail h2{font-size:17px}.comparison{grid-template-columns:1fr;gap:18px}.below{font-size:11px}.sources{gap:9px}}
</style></head>
<body>
<header><div><div class="overline">FACTORLAB / DESIGN EXPLORATION 01</div><h1 class="title">四种配色，四种研究节奏。</h1><p class="intro">同一组研究问题与配置草稿，用不同布局比较信息层级、阅读舒适度和操作重点。</p></div><div class="status">只做方案草图 · 正式网站未改动</div></header>
<main class="content">
<div class="controls"><div class="scheme-tabs" aria-label="选择设计方案"><button data-scheme="a" aria-pressed="true">A　瓷白墨蓝</button><button data-scheme="b" aria-pressed="false">B　深海冰青</button><button data-scheme="c" aria-pressed="false">C　雾绿纸白</button><button data-scheme="d" aria-pressed="false">D　月白绛紫</button></div><div class="view-tabs" aria-label="预览方式"><button data-mode="desktop" aria-pressed="true">桌面</button><button data-mode="mobile" aria-pressed="false">手机</button><button data-mode="compare" aria-pressed="false">四版对比</button></div></div>
<section class="preview">
<div class="detail"><div><h2 id="name">A / 瓷白墨蓝</h2><p id="description">顶部导航 + 横向行业清单。明亮、克制，适合长时间研究与课程演示。</p></div><div class="chips" id="chips"></div></div>
<div class="frame-area" id="area"><div class="frame-fit" id="fit"><iframe title="方案 A 设计草图" src="a-porcelain.html" id="preview" sandbox="allow-scripts"></iframe></div></div>
<div class="below"><span id="layout-note">以行业比较为中心，把净值和轮次收进次级信息。</span><a id="open-full" href="a-porcelain.html" target="_blank" rel="noopener">打开完整尺寸 ↗</a></div>
</section>
<section class="comparison" aria-label="四版设计并排比较" hidden>
<button class="choice" data-choice="a"><div class="choice-head"><div><h2>A / 瓷白墨蓝</h2><p>横向研究台 · 清爽、理性、清单优先</p></div><div class="mini-swatches"><i style="--c:#F4F5F7"></i><i style="--c:#FFFFFF"></i><i style="--c:#192335"></i><i style="--c:#3559D8"></i></div></div><img src="previews/a-desktop.png" alt="A方案：白底顶部导航，横向行业比较，右侧蓝色研究提示"><footer><span>行业清单 → 周期证据 → 因子检验</span><span>查看大图 ↗</span></footer></button>
<button class="choice" data-choice="b"><div class="choice-head"><div><h2>B / 深海冰青</h2><p>因子工作台 · 沉静、专业、图表优先</p></div><div class="mini-swatches"><i style="--c:#071B26"></i><i style="--c:#0D2B38"></i><i style="--c:#A4E7DA"></i><i style="--c:#EDF6F5"></i></div></div><img src="previews/b-desktop.png" alt="B方案：深海蓝工作台，窄侧栏、大幅因子图表与右侧证据"><footer><span>因子分歧 → 证据核对 → 配置草稿</span><span>查看大图 ↗</span></footer></button>
<button class="choice" data-choice="c"><div class="choice-head"><div><h2>C / 雾绿纸白</h2><p>研究笔记 · 安静、书卷感、证据优先</p></div><div class="mini-swatches"><i style="--c:#EFF2EA"></i><i style="--c:#FEFFF9"></i><i style="--c:#203E37"></i><i style="--c:#527765"></i></div></div><img src="previews/c-desktop.png" alt="C方案：雾绿侧栏和纸白证据阅读页，紧凑决策草稿"><footer><span>阅读证据 → 写下判断 → 形成草稿</span><span>查看大图 ↗</span></footer></button>
<button class="choice" data-choice="d"><div class="choice-head"><div><h2>D / 月白绛紫</h2><p>决策工作室 · 明暗分区、个性、行动优先</p></div><div class="mini-swatches"><i style="--c:#F8F5F6"></i><i style="--c:#FFFFFF"></i><i style="--c:#241E2C"></i><i style="--c:#7C3652"></i></div></div><img src="previews/d-desktop.png" alt="D方案：月白研究区域和深梅色决策栏的明暗分栏"><footer><span>证据与判断并排 → 检验 → 决策</span><span>查看大图 ↗</span></footer></button>
</section>
<div class="sources"><span>所有图形与数字为草图示意。仅预览，不连接账户、行情或在线 AI。</span><a href="https://linear.app/now/how-we-redesigned-the-linear-ui" target="_blank" rel="noopener">参考：Linear 信息层级</a><a href="https://www.carbondesignsystem.com/building-blocks/foundations/2x-grid/overview" target="_blank" rel="noopener">Carbon 栅格</a><a href="https://mercury.com/insights" target="_blank" rel="noopener">Mercury 数据布局</a></div>
</main>
<script>
const schemes={
 a:{file:'a-porcelain.html',name:'A / 瓷白墨蓝',description:'顶部导航 + 横向行业清单。明亮、克制，适合长时间研究与课程演示。',note:'以行业比较为中心，把净值和轮次收进次级信息。',colors:['#F4F5F7','#FFFFFF','#192335','#3559D8']},
 b:{file:'b-deep-sea.html',name:'B / 深海冰青',description:'窄侧栏 + 大幅因子图表 + 证据检查。用低饱和蓝绿代替中性黑灰。',note:'把更多宽度让给图表，证据和下一步始终在旁边。',colors:['#071B26','#0D2B38','#A4E7DA','#EDF6F5']},
 c:{file:'c-sage.html',name:'C / 雾绿纸白',description:'文字侧栏 + 连续证据阅读 + 决策草稿。留白和规则线取代密集卡片。',note:'优先阅读、思考与记录，偏研究笔记的节奏。',colors:['#EFF2EA','#FEFFF9','#203E37','#527765']},
 d:{file:'d-plum.html',name:'D / 月白绛紫',description:'浅色研究面 + 深梅色决策栏。让观察信息和采取行动有清楚的空间分工。',note:'适合希望保留个性，同时突出决策流程的方向。',colors:['#F8F5F6','#FFFFFF','#241E2C','#7C3652']}
};
let selected='a',mode='desktop';
const $=id=>document.getElementById(id);
function size(){const width=mode==='mobile'?390:1440,height=mode==='mobile'?844:900;const scale=Math.min(1,($('area').clientWidth-(mode==='mobile'?24:0))/width);$('fit').style.width=width*scale+'px';$('fit').style.height=height*scale+'px';$('preview').style.width=width+'px';$('preview').style.height=height+'px';$('preview').style.transform='scale('+scale+')';}
function show(){const item=schemes[selected];$('name').textContent=item.name;$('description').textContent=item.description;$('layout-note').textContent=item.note;$('open-full').href=item.file;$('preview').title=item.name+'设计草图';if(!$('preview').getAttribute('src').endsWith(item.file))$('preview').src=item.file;$('chips').innerHTML=item.colors.map(c=>'<span class="chip"><i style="--c:'+c+'"></i>'+c+'</span>').join('');document.querySelectorAll('[data-scheme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scheme===selected)));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('.preview').hidden=mode==='compare';document.querySelector('.comparison').hidden=mode!=='compare';$('area').classList.toggle('mobile',mode==='mobile');size();}
document.querySelectorAll('[data-scheme]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.scheme;if(mode==='compare')mode='desktop';show();}));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;show();}));
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.choice;mode='desktop';document.body.classList.remove('board-only');show();window.scrollTo(0,0);}));
if(new URLSearchParams(location.search).has('board')){mode='compare';document.body.classList.add('board-only');}
new ResizeObserver(size).observe($('area'));show();
</script></body></html>
